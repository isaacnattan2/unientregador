// Keep generated native paths short enough for Ninja on Windows.
subprojects { module ->
    if (!System.getProperty('os.name').startsWith('Windows')) return

    if (module.name == 'expo-modules-core') {
        module.pluginManager.withPlugin('com.android.library') {
            module.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.externalNativeBuild.cmake.buildStagingDirectory(rootProject.file('../.expo/cxx/expo'))
            }
        }
    }

    if (module.name in ['app', 'expo-updates', 'sentry_react-native']) {
        def plugin = module.name == 'app' ? 'com.android.application' : 'com.android.library'
        module.pluginManager.withPlugin(plugin) {
            module.extensions.getByName('androidComponents').finalizeDsl { android ->
                def projectId = Integer.toHexString(rootProject.projectDir.absolutePath.hashCode())
                def prefix = [app: 'cmake', 'expo-updates': 'updates', 'sentry_react-native': 'sentry'][module.name]
                def folder = "uni-${prefix}-${projectId}"
                def staging = new File(System.getProperty('java.io.tmpdir'), folder)
                android.externalNativeBuild.cmake.buildStagingDirectory(staging)
                android.defaultConfig.externalNativeBuild.cmake.arguments('-DCMAKE_OBJECT_PATH_MAX=250')
            }
        }
    }
}
